<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎡 Колесо Апгрейдер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
        }
        .game-container {
            max-width: 800px;
            width: 100%;
            background: rgba(20, 20, 50, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 30px 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #fff;
            padding: 0 8px;
        }
        .coins {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .coins span {
            font-size: 1.2rem;
            color: #aaa;
            -webkit-text-fill-color: #aaa;
        }
        .wheel-wrapper {
            position: relative;
            margin: 20px auto;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1;
        }
        .wheel-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2), 0 0 80px rgba(255, 215, 0, 0.1);
            background: #1a1a3e;
            padding: 12px;
        }
        canvas#wheelCanvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            display: block;
            cursor: pointer;
            transition: filter 0.3s;
        }
        canvas#wheelCanvas:hover {
            filter: brightness(1.05);
        }
        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
            z-index: 10;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .spin-btn {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border: none;
            border-radius: 50px;
            padding: 14px 32px;
            font-size: 1.3rem;
            font-weight: 800;
            color: #1a1a3e;
            cursor: pointer;
            box-shadow: 0 8px 0 #b37b1a, 0 12px 30px rgba(255, 215, 0, 0.3);
            transition: all 0.08s linear;
            z-index: 10;
            letter-spacing: 1px;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .spin-btn:active {
            transform: translateX(-50%) translateY(6px);
            box-shadow: 0 2px 0 #b37b1a;
        }
        .spin-btn:disabled {
            opacity: 0.5;
            transform: translateX(-50%) translateY(4px);
            box-shadow: 0 4px 0 #b37b1a;
            cursor: not-allowed;
        }
        .result-popup {
            text-align: center;
            margin: 16px 0 10px;
            min-height: 50px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            transition: all 0.3s;
        }
        .upgrades-section {
            margin-top: 24px;
            background: rgba(0,0,0,0.3);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .upgrades-title {
            color: #aaa;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            text-align: center;
        }
        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .upgrade-card {
            background: rgba(30, 30, 70, 0.6);
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.2s;
        }
        .upgrade-card:hover {
            border-color: rgba(255, 215, 0, 0.2);
            background: rgba(40, 40, 90, 0.6);
        }
        .upgrade-name {
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
        }
        .upgrade-desc {
            color: #888;
            font-size: 0.8rem;
            margin: 4px 0 8px;
        }
        .upgrade-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 8px;
        }
        .upgrade-btn {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2d2d6b, #1a1a3e);
            color: #888;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .upgrade-btn.buyable {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a3e;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
        }
        .upgrade-btn.buyable:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.3);
        }
        .upgrade-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .reset-btn {
            background: transparent;
            border: 1px solid #444;
            color: #666;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            margin-top: 16px;
        }
        .reset-btn:hover {
            border-color: #888;
            color: #aaa;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }
        @media (max-width: 500px) {
            .upgrade-grid { grid-template-columns: 1fr; }
            .coins { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <!-- Верхняя панель -->
    <div class="header">
        <div class="coins">🪙 <span id="coinDisplay">100</span></div>
        <div style="color:#888; font-size:0.9rem;">⚡ <span id="luckDisplay">1.0</span>x</div>
    </div>

    <!-- Колесо -->
    <div class="wheel-wrapper">
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
            <div class="pointer">▼</div>
            <button class="spin-btn" id="spinBtn">🎡 КРУТИТЬ</button>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-popup" id="resultPopup">👉 Нажми на колесо или кнопку</div>

    <!-- Апгрейды -->
    <div class="upgrades-section">
        <div class="upgrades-title">⬆️ УЛУЧШЕНИЯ КОЛЕСА</div>
        <div class="upgrade-grid" id="upgradeGrid">
            <!-- Карточки апгрейдов генерируются JS -->
        </div>
        <div class="footer">
            <button class="reset-btn" id="resetBtn">⟳ сбросить</button>
            <span style="color:#444; font-size:0.7rem;">v2.0 · удача</span>
        </div>
    </div>
</div>

<script>
    (function() {
        // ====== КОНФИГ ======
        const SEGMENTS = [
            { label: '10', value: 10, color: '#ff6b6b' },
            { label: '20', value: 20, color: '#feca57' },
            { label: '5', value: 5, color: '#48dbfb' },
            { label: '50', value: 50, color: '#ff9ff3' },
            { label: 'x2', value: 'x2', color: '#54a0ff' },
            { label: '0', value: 0, color: '#5f27cd' },
            { label: '30', value: 30, color: '#1dd1a1' },
            { label: 'x3', value: 'x3', color: '#f368e0' },
        ];

        // ====== СОСТОЯНИЕ ======
        const state = {
            coins: 100,
            spinCost: 10,
            multiplier: 1.0,      // общий множитель наград
            luckLevel: 1,         // уровень удачи (влияет на шансы)
            segmentMultiplier: 1, // множитель от апгрейда сегментов
            upgrades: [
                { id: 'luck', name: '🍀 Удача', desc: 'шанс на x2/x3 +5%', baseCost: 30, costMult: 1.6, level: 0, maxLevel: 10, effect: 'luck' },
                { id: 'multi', name: '✨ Множитель', desc: 'все награды x1.2', baseCost: 50, costMult: 1.8, level: 0, maxLevel: 8, effect: 'multi' },
                { id: 'cost', name: '💰 Скидка', desc: 'крутка -2 монеты', baseCost: 40, costMult: 1.7, level: 0, maxLevel: 6, effect: 'cost' },
                { id: 'segment', name: '🎯 Сегменты', desc: '+2 к выигрышу', baseCost: 60, costMult: 2.0, level: 0, maxLevel: 5, effect: 'segment' },
            ]
        };

        // ====== DOM ======
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const coinDisplay = document.getElementById('coinDisplay');
        const luckDisplay = document.getElementById('luckDisplay');
        const resultPopup = document.getElementById('resultPopup');
        const upgradeGrid = document.getElementById('upgradeGrid');
        const resetBtn = document.getElementById('resetBtn');

        let isSpinning = false;
        let currentAngle = 0;
        let animationId = null;

        // ====== ВСПОМОГАТЕЛЬНЫЕ ======
        function formatNum(n) {
            if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
            if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
            return Math.floor(n);
        }

        function getUpgradeCost(upgrade) {
            return Math.floor(upgrade.baseCost * Math.pow(upgrade.costMult, upgrade.level));
        }

        // ====== РИСОВАНИЕ КОЛЕСА ======
        function drawWheel(angle) {
            const w = canvas.width;
            const h = canvas.height;
            const centerX = w/2;
            const centerY = h/2;
            const radius = Math.min(w, h) * 0.42;

            ctx.clearRect(0, 0, w, h);
            
            const segmentAngle = (2 * Math.PI) / SEGMENTS.length;
            
            SEGMENTS.forEach((seg, i) => {
                const startAngle = angle + i * segmentAngle;
                const endAngle = startAngle + segmentAngle;
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                
                // градиент
                const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
                grad.addColorStop(0, lightenColor(seg.color, 30));
                grad.addColorStop(1, seg.color);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // текст
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + segmentAngle/2);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 22px "Segoe UI", sans-serif';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 10;
                ctx.fillText(seg.label, radius * 0.65, 0);
                ctx.restore();
            });

            // центральный круг
            const gradient = ctx.createRadialGradient(centerX-10, centerY-10, 0, centerX, centerY, 35);
            gradient.addColorStop(0, '#4a4a8a');
            gradient.addColorStop(1, '#1a1a3e');
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,215,0,0.3)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // внешнее свечение
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius+6, 0, 2*Math.PI);
            ctx.strokeStyle = 'rgba(255,215,0,0.08)';
            ctx.lineWidth = 8;
            ctx.stroke();
        }

        function lightenColor(hex, percent) {
            const num = parseInt(hex.replace('#',''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return `#${(1 << 24 | R << 16 | G << 8 | B).toString(16).slice(1)}`;
        }

        // ====== ЛОГИКА КРУТКИ ======
        function getSpinResult() {
            // базовая удача: случайный сектор
            const rawIndex = Math.floor(Math.random() * SEGMENTS.length);
            let seg = SEGMENTS[rawIndex];
            
            // влияние апгрейда удачи: дополнительный шанс на x2/x3
            const luckBonus = state.upgrades.find(u => u.id === 'luck').level * 0.05; // +5% за уровень
            const extraChance = Math.random() < luckBonus;
            
            let finalValue = seg.value;
            let label = seg.label;
            
            if (extraChance && (seg.value === 'x2' || seg.value === 'x3')) {
                // уже выпал множитель, но удача может удвоить
                if (seg.value === 'x2') finalValue = 'x4';
                else if (seg.value === 'x3') finalValue = 'x6';
                label = finalValue;
            } else if (extraChance && typeof seg.value === 'number') {
                // если выпали монеты, удача добавляет бонус
                finalValue = Math.floor(seg.value * 1.5);
                label = finalValue.toString();
            }
            
            // применение общего множителя (если число)
            let reward = 0;
            let isMultiplier = false;
            let multiplierValue = 1;
            
            if (typeof finalValue === 'string' && finalValue.startsWith('x')) {
                isMultiplier = true;
                multiplierValue = parseFloat(finalValue.substring(1));
                // множитель применяется к текущим монетам? нет, к следующему выигрышу
                // но мы можем дать бонус
                reward = Math.floor(state.coins * 0.1 * multiplierValue);
            } else if (typeof finalValue === 'number') {
                reward = Math.floor(finalValue * state.multiplier) + state.upgrades.find(u => u.id === 'segment').level * 2;
            }
            
            return { 
                reward, 
                isMultiplier, 
                multiplierValue,
                label: typeof finalValue === 'string' ? finalValue : finalValue.toString(),
                rawIndex,
                segment: seg
            };
        }

        function spinWheel() {
            if (isSpinning) return;
            if (state.coins < state.spinCost) {
                resultPopup.textContent = '❌ Не хватает монет!';
                resultPopup.style.color = '#ff6b6b';
                return;
            }

            state.coins -= state.spinCost;
            isSpinning = true;
            spinBtn.disabled = true;
            resultPopup.textContent = '🎡 Крутим...';

            // определяем результат
            const result = getSpinResult();
            
            // рассчитываем финальный угол (чтобы указатель попал на нужный сектор)
            const segmentAngle = (2 * Math.PI) / SEGMENTS.length;
            // целевой угол: противоположный сектор (указатель сверху)
            const targetSegIndex = result.rawIndex;
            // указатель сверху = -PI/2, поэтому сектор должен быть внизу
            const targetAngle = -Math.PI/2 - (targetSegIndex * segmentAngle) - segmentAngle/2;
            
            // добавляем несколько оборотов для красоты
            const extraSpins = 5 + Math.floor(Math.random() * 3);
            const finalAngle = targetAngle + extraSpins * 2 * Math.PI;
            
            // анимация
            const startAngle = currentAngle;
            const duration = 3000 + Math.random() * 1000;
            const startTime = performance.now();
            
            function animateSpin(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // easeOutCubic
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = startAngle + (finalAngle - startAngle) * eased;
                currentAngle = current;
                drawWheel(current);
                
                if (progress < 1) {
                    animationId = requestAnimationFrame(animateSpin);
                } else {
                    currentAngle = finalAngle;
                    drawWheel(currentAngle);
                    // показываем результат
                    applyResult(result);
                    isSpinning = false;
                    spinBtn.disabled = false;
                }
            }
            
            animationId = requestAnimationFrame(animateSpin);
        }

        function applyResult(result) {
            let message = '';
            let color = '#ffd700';
            
            if (result.isMultiplier) {
                // множитель: даём бонусные монеты
                const bonus = Math.floor(state.coins * 0.15 * result.multiplierValue);
                state.coins += bonus;
                message = `🎯 x${result.multiplierValue}! +${bonus} монет!`;
                color = '#ff6bff';
            } else {
                state.coins += result.reward;
                message = `💰 +${result.reward} монет!`;
                if (result.reward >= 50) color = '#ffd700';
                else if (result.reward >= 20) color = '#feca57';
                else color = '#48dbfb';
            }
            
            resultPopup.textContent = message;
            resultPopup.style.color = color;
            updateUI();
            renderUpgrades();
        }

        // ====== АПГРЕЙДЫ ======
        function buyUpgrade(id) {
            const upg = state.upgrades.find(u => u.id === id);
            if (!upg) return;
            if (upg.level >= upg.maxLevel) {
                resultPopup.textContent = '❌ Максимальный уровень!';
                return;
            }
            const cost = getUpgradeCost(upg);
            if (state.coins < cost) {
                resultPopup.textContent = '❌ Не хватает монет!';
                return;
            }
            
            state.coins -= cost;
            upg.level += 1;
            
            // применяем эффект
            switch(upg.effect) {
                case 'luck':
                    // ничего, используется в getSpinResult
                    break;
                case 'multi':
                    state.multiplier = 1 + upg.level * 0.2;
                    break;
                case 'cost':
                    state.spinCost = Math.max(2, 10 - upg.level * 2);
                    break;
                case 'segment':
                    // используется в getSpinResult
                    break;
            }
            
            resultPopup.textContent = `⬆️ ${upg.name} улучшен до ${upg.level} уровня!`;
            resultPopup.style.color = '#48dbfb';
            updateUI();
            renderUpgrades();
        }

        // ====== UI ======
        function updateUI() {
            coinDisplay.textContent = formatNum(state.coins);
            luckDisplay.textContent = (1 + state.upgrades.find(u => u.id === 'luck').level * 0.05).toFixed(2);
            spinBtn.textContent = `🎡 КРУТИТЬ (${state.spinCost} 🪙)`;
            // обновим доступность кнопки
            spinBtn.disabled = isSpinning || state.coins < state.spinCost;
        }

        function renderUpgrades() {
            let html = '';
            state.upgrades.forEach(upg => {
                const cost = getUpgradeCost(upg);
                const canBuy = state.coins >= cost && upg.level < upg.maxLevel;
                const isMaxed = upg.level >= upg.maxLevel;
                
                html += `
                    <div class="upgrade-card">
                        <div class="upgrade-name">${upg.name}</div>
                        <div class="upgrade-desc">${upg.desc}</div>
                        <div class="upgrade-stats">
                            <span>ур. ${upg.level}/${upg.maxLevel}</span>
                            <span>💰 ${formatNum(cost)}</span>
                        </div>
                        <button class="upgrade-btn ${canBuy ? 'buyable' : ''}" 
                                ${!canBuy ? 'disabled' : ''}
                                onclick="window.buyUpgrade('${upg.id}')">
                            ${isMaxed ? '✅ MAX' : (canBuy ? 'Купить' : 'не хватает')}
                        </button>
                    </div>
                `;
            });
            upgradeGrid.innerHTML = html;
        }

        // делаем buyUpgrade глобальной для onclick
        window.buyUpgrade = buyUpgrade;

        // ====== СБРОС ======
        function resetGame() {
            if (!confirm('Сбросить весь прогресс?')) return;
            state.coins = 100;
            state.spinCost = 10;
            state.multiplier = 1.0;
            state.upgrades.forEach(u => u.level = 0);
            currentAngle = 0;
            drawWheel(0);
            updateUI();
            renderUpgrades();
            resultPopup.textContent = '🔄 Прогресс сброшен';
            resultPopup.style.color = '#888';
        }

        // ====== СОХРАНЕНИЕ ======
        function saveGame() {
            try {
                const data = {
                    coins: state.coins,
                    spinCost: state.spinCost,
                    multiplier: state.multiplier,
                    upgrades: state.upgrades.map(u => ({ id: u.id, level: u.level }))
                };
                localStorage.setItem('wheel_upgrader_save', JSON.stringify(data));
            } catch(e) {}
        }

        function loadGame() {
            try {
                const raw = localStorage.getItem('wheel_upgrader_save');
                if (!raw) return;
                const data = JSON.parse(raw);
                state.coins = data.coins || 100;
                state.spinCost = data.spinCost || 10;
                state.multiplier = data.multiplier || 1.0;
                if (data.upgrades) {
                    data.upgrades.forEach(saved => {
                        const found = state.upgrades.find(u => u.id === saved.id);
                        if (found) found.level = saved.level || 0;
                    });
                }
                // переприменить эффекты
                state.upgrades.forEach(upg => {
                    switch(upg.effect) {
                        case 'multi':
                            state.multiplier = 1 + upg.level * 0.2;
                            break;
                        case 'cost':
                            state.spinCost = Math.max(2, 10 - upg.level * 2);
                            break;
                    }
                });
            } catch(e) {}
        }

        // ====== ИНИЦИАЛИЗАЦИЯ ======
        loadGame();
        drawWheel(0);
        updateUI();
        renderUpgrades();

        // события
        spinBtn.addEventListener('click', spinWheel);
        canvas.addEventListener('click', spinWheel);
        resetBtn.addEventListener('click', resetGame);

        // автосохранение
        setInterval(saveGame, 5000);
        window.addEventListener('beforeunload', saveGame);

        console.log('🎡 Колесо Апгрейдер запущено!');
    })();
</script>
</body>
</html>
