<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Казино-Апгрейдер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #2d1b4e);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
        }
        .game-container {
            max-width: 700px;
            width: 100%;
            background: rgba(20, 15, 35, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 30px 24px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 40px rgba(255, 215, 0, 0.05);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #fff;
            padding: 0 8px;
        }
        .coins {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .coins span {
            font-size: 1rem;
            color: #888;
            -webkit-text-fill-color: #888;
        }

        /* === БЛОК СТАВКИ === */
        .bet-section {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,215,0,0.08);
        }
        .bet-label {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: block;
        }
        .bet-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .bet-input {
            flex: 1;
            min-width: 120px;
            padding: 12px 16px;
            border-radius: 14px;
            border: 2px solid #333;
            background: #0a0a1a;
            color: #ffd700;
            font-size: 1.2rem;
            font-weight: 700;
            outline: none;
            transition: 0.2s;
        }
        .bet-input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }
        .bet-presets {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .bet-preset-btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid #333;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            font-weight: 600;
        }
        .bet-preset-btn:hover {
            border-color: #ffd700;
            color: #ffd700;
        }
        .bet-preset-btn.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        /* === КОЛЕСО === */
        .wheel-wrapper {
            position: relative;
            margin: 10px auto;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
        }
        .wheel-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15), 0 0 80px rgba(255, 215, 0, 0.05);
            background: #0a0a1a;
            padding: 10px;
        }
        canvas#wheelCanvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            display: block;
            cursor: pointer;
            transition: filter 0.3s;
        }
        canvas#wheelCanvas:hover {
            filter: brightness(1.05);
        }
        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
            z-index: 10;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .spin-btn {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border: none;
            border-radius: 50px;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #0a0a1a;
            cursor: pointer;
            box-shadow: 0 8px 0 #b37b1a, 0 12px 30px rgba(255, 215, 0, 0.2);
            transition: all 0.08s linear;
            z-index: 10;
            letter-spacing: 1px;
            border: 2px solid rgba(255,255,255,0.2);
            white-space: nowrap;
        }
        .spin-btn:active {
            transform: translateX(-50%) translateY(6px);
            box-shadow: 0 2px 0 #b37b1a;
        }
        .spin-btn:disabled {
            opacity: 0.4;
            transform: translateX(-50%) translateY(4px);
            box-shadow: 0 4px 0 #b37b1a;
            cursor: not-allowed;
        }

        /* === РЕЗУЛЬТАТ === */
        .result-popup {
            text-align: center;
            margin: 12px 0 10px;
            min-height: 50px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            transition: all 0.3s;
        }
        .chance-display {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .chance-display span {
            color: #ffd700;
            font-weight: 700;
        }

        /* === АПГРЕЙДЫ (внизу) === */
        .upgrades-section {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 24px;
            padding: 18px 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .upgrades-title {
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-align: center;
        }
        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }
        .upgrade-card {
            background: rgba(30, 20, 50, 0.6);
            border-radius: 14px;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        .upgrade-card:hover {
            border-color: rgba(255, 215, 0, 0.15);
        }
        .upgrade-name {
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .upgrade-desc {
            color: #777;
            font-size: 0.75rem;
            margin: 3px 0 6px;
        }
        .upgrade-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 6px;
        }
        .upgrade-btn {
            width: 100%;
            padding: 6px;
            border: none;
            border-radius: 8px;
            background: #2a1a3e;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .upgrade-btn.buyable {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0a1a;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.15);
        }
        .upgrade-btn.buyable:hover {
            transform: scale(1.02);
        }
        .upgrade-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        .reset-btn {
            background: transparent;
            border: 1px solid #333;
            color: #555;
            padding: 4px 14px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
            margin-top: 12px;
        }
        .reset-btn:hover {
            border-color: #666;
            color: #888;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        @media (max-width: 500px) {
            .bet-controls { flex-direction: column; }
            .bet-presets { justify-content: center; }
            .upgrade-grid { grid-template-columns: 1fr 1fr; }
            .spin-btn { font-size: 1rem; padding: 10px 20px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <!-- Верхняя панель -->
    <div class="header">
        <div class="coins">🪙 <span id="coinDisplay">50</span></div>
        <div style="color:#666; font-size:0.85rem;">🎯 <span id="winCountDisplay">0</span></div>
    </div>

    <!-- Блок ставки -->
    <div class="bet-section">
        <label class="bet-label">💰 СТАВКА (чем больше, тем меньше шанс)</label>
        <div class="bet-controls">
            <input type="number" class="bet-input" id="betInput" value="10" min="1" step="1">
            <div class="bet-presets">
                <button class="bet-preset-btn" data-amount="5">5</button>
                <button class="bet-preset-btn active" data-amount="10">10</button>
                <button class="bet-preset-btn" data-amount="25">25</button>
                <button class="bet-preset-btn" data-amount="50">50</button>
                <button class="bet-preset-btn" data-amount="100">100</button>
            </div>
        </div>
        <div class="chance-display" id="chanceDisplay">Шанс выигрыша: <span>50%</span></div>
    </div>

    <!-- Колесо -->
    <div class="wheel-wrapper">
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
            <div class="pointer">▼</div>
            <button class="spin-btn" id="spinBtn">🎡 КРУТИТЬ</button>
        </div>
    </div>

    <!-- Результат -->
    <div class="result-popup" id="resultPopup">👉 Сделай ставку и крути!</div>

    <!-- Апгрейды -->
    <div class="upgrades-section">
        <div class="upgrades-title">⬆️ УЛУЧШЕНИЯ</div>
        <div class="upgrade-grid" id="upgradeGrid"></div>
        <div class="footer">
            <button class="reset-btn" id="resetBtn">⟳ сброс</button>
            <span style="color:#333; font-size:0.65rem;">ставки · удача</span>
        </div>
    </div>
</div>

<script>
    (function() {
        // ====== КОНФИГ СЕКТОРОВ ======
        const SEGMENTS = [
            { label: '0', value: 0, color: '#5f27cd' },
            { label: '5', value: 5, color: '#48dbfb' },
            { label: '0', value: 0, color: '#5f27cd' },
            { label: '10', value: 10, color: '#1dd1a1' },
            { label: '0', value: 0, color: '#5f27cd' },
            { label: '20', value: 20, color: '#feca57' },
            { label: '0', value: 0, color: '#5f27cd' },
            { label: '50', value: 50, color: '#ff6b6b' },
        ];

        // ====== СОСТОЯНИЕ ======
        const state = {
            coins: 50,
            winCount: 0,
            bet: 10,
            upgrades: [
                { id: 'luck', name: '🍀 Удача', desc: '+5% к шансу', baseCost: 30, costMult: 1.6, level: 0, maxLevel: 10, effect: 'luck' },
                { id: 'multi', name: '✨ Множитель', desc: 'выигрыш x1.2', baseCost: 40, costMult: 1.7, level: 0, maxLevel: 8, effect: 'multi' },
                { id: 'refund', name: '🔄 Возврат', desc: 'при проигрыше возврат 10%', baseCost: 25, costMult: 1.5, level: 0, maxLevel: 8, effect: 'refund' },
            ]
        };

        // ====== DOM ======
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const coinDisplay = document.getElementById('coinDisplay');
        const winCountDisplay = document.getElementById('winCountDisplay');
        const resultPopup = document.getElementById('resultPopup');
        const betInput = document.getElementById('betInput');
        const chanceDisplay = document.getElementById('chanceDisplay');
        const upgradeGrid = document.getElementById('upgradeGrid');
        const resetBtn = document.getElementById('resetBtn');

        let isSpinning = false;
        let currentAngle = 0;
        let animationId = null;

        // ====== ВСПОМОГАТЕЛЬНЫЕ ======
        function formatNum(n) {
            if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
            if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
            return Math.floor(n);
        }

        function getUpgradeCost(upgrade) {
            return Math.floor(upgrade.baseCost * Math.pow(upgrade.costMult, upgrade.level));
        }

        // ====== РАСЧЁТ ШАНСА ======
        function getChance(bet) {
            // Чем больше ставка, тем меньше шанс
            // База: 70% при ставке 1, падает до ~5% при ставке 500
            const luckBonus = state.upgrades.find(u => u.id === 'luck').level * 0.05;
            const baseChance = Math.max(0.05, 0.7 / (1 + bet * 0.015));
            return Math.min(0.95, baseChance + luckBonus);
        }

        // ====== РИСОВАНИЕ КОЛЕСА ======
        function drawWheel(angle) {
            const w = canvas.width, h = canvas.height;
            const cx = w/2, cy = h/2;
            const radius = Math.min(w, h) * 0.42;
            const segAngle = (2 * Math.PI) / SEGMENTS.length;

            ctx.clearRect(0, 0, w, h);
            
            SEGMENTS.forEach((seg, i) => {
                const start = angle + i * segAngle;
                const end = start + segAngle;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, start, end);
                ctx.closePath();
                
                const grad = ctx.createRadialGradient(cx-10, cy-10, 0, cx, cy, radius);
                grad.addColorStop(0, lightenColor(seg.color, 40));
                grad.addColorStop(1, seg.color);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(start + segAngle/2);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px "Segoe UI", sans-serif';
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur = 10;
                ctx.fillText(seg.label, radius * 0.65, 0);
                ctx.restore();
            });

            // Центр
            const grad2 = ctx.createRadialGradient(cx-8, cy-8, 0, cx, cy, 28);
            grad2.addColorStop(0, '#4a2a7a');
            grad2.addColorStop(1, '#0a0a1a');
            ctx.beginPath();
            ctx.arc(cx, cy, 28, 0, 2*Math.PI);
            ctx.fillStyle = grad2;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,215,0,0.2)';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function lightenColor(hex, percent) {
            const num = parseInt(hex.replace('#',''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return `#${(1 << 24 | R << 16 | G << 8 | B).toString(16).slice(1)}`;
        }

        // ====== ЛОГИКА КРУТКИ ======
        function spinWheel() {
            if (isSpinning) return;
            
            const bet = parseInt(betInput.value) || 10;
            if (bet < 1) {
                resultPopup.textContent = '❌ Ставка должна быть ≥ 1';
                return;
            }
            if (bet > state.coins) {
                resultPopup.textContent = '❌ Не хватает монет!';
                return;
            }

            const chance = getChance(bet);
            const isWin = Math.random() < chance;
            
            // Списываем ставку
            state.coins -= bet;

            // Определяем сектор
            let winIndex;
            if (isWin) {
                // Выигрыш: выбираем сектор с наградой > 0
                const positiveSegs = SEGMENTS.map((s, i) => s.value > 0 ? i : -1).filter(i => i >= 0);
                winIndex = positiveSegs[Math.floor(Math.random() * positiveSegs.length)];
            } else {
                // Проигрыш: сектор с 0
                const zeroSegs = SEGMENTS.map((s, i) => s.value === 0 ? i : -1).filter(i => i >= 0);
                winIndex = zeroSegs[Math.floor(Math.random() * zeroSegs.length)];
            }

            // Расчёт выигрыша
            let winAmount = 0;
            const multiBonus = state.upgrades.find(u => u.id === 'multi').level * 0.2 + 1;
            
            if (isWin) {
                const baseWin = SEGMENTS[winIndex].value;
                winAmount = Math.floor(baseWin * bet * multiBonus);
                state.coins += winAmount;
                state.winCount += 1;
            } else {
                // Возврат при проигрыше
                const refundLevel = state.upgrades.find(u => u.id === 'refund').level;
                if (refundLevel > 0) {
                    const refundPercent = refundLevel * 0.1;
                    const refund = Math.floor(bet * refundPercent);
                    if (refund > 0) {
                        state.coins += refund;
                        winAmount = -refund; // отрицательное для отображения возврата
                    }
                }
            }

            // Анимация
            const segAngle = (2 * Math.PI) / SEGMENTS.length;
            const targetAngle = -Math.PI/2 - (winIndex * segAngle) - segAngle/2;
            const extraSpins = 5 + Math.floor(Math.random() * 4);
            const finalAngle = targetAngle + extraSpins * 2 * Math.PI;
            
            isSpinning = true;
            spinBtn.disabled = true;
            
            const startAngle = currentAngle;
            const duration = 3000 + Math.random() * 1200;
            const startTime = performance.now();

            function animateSpin(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = startAngle + (finalAngle - startAngle) * eased;
                currentAngle = current;
                drawWheel(current);
                
                if (progress < 1) {
                    animationId = requestAnimationFrame(animateSpin);
                } else {
                    currentAngle = finalAngle;
                    drawWheel(currentAngle);
                    
                    // Показываем результат
                    let msg = '';
                    let color = '#ffd700';
                    if (isWin) {
                        msg = `🎉 ВЫИГРЫШ! +${winAmount} 🪙`;
                        color = '#ffd700';
                    } else {
                        if (winAmount < 0) {
                            msg = `😅 Проигрыш... Возврат ${Math.abs(winAmount)} 🪙`;
                            color = '#48dbfb';
                        } else {
                            msg = `😅 Проигрыш... -${bet} 🪙`;
                            color = '#ff6b6b';
                        }
                    }
                    resultPopup.textContent = msg;
                    resultPopup.style.color = color;
                    
                    updateUI();
                    renderUpgrades();
                    isSpinning = false;
                    spinBtn.disabled = false;
                }
            }
            
            animationId = requestAnimationFrame(animateSpin);
        }

        // ====== АПГРЕЙДЫ ======
        function buyUpgrade(id) {
            const upg = state.upgrades.find(u => u.id === id);
            if (!upg) return;
            if (upg.level >= upg.maxLevel) {
                resultPopup.textContent = '❌ Максимальный уровень!';
                return;
            }
            const cost = getUpgradeCost(upg);
            if (state.coins < cost) {
                resultPopup.textContent = '❌ Не хватает монет!';
                return;
            }
            
            state.coins -= cost;
            upg.level += 1;
            
            resultPopup.textContent = `⬆️ ${upg.name} улучшен до ${upg.level} уровня!`;
            resultPopup.style.color = '#48dbfb';
            updateUI();
            renderUpgrades();
            updateChanceDisplay();
        }

        // ====== ОБНОВЛЕНИЕ UI ======
        function updateUI() {
            coinDisplay.textContent = formatNum(state.coins);
            winCountDisplay.textContent = state.winCount;
            spinBtn.disabled = isSpinning || state.coins < (parseInt(betInput.value) || 1);
            updateChanceDisplay();
        }

        function updateChanceDisplay() {
            const bet = parseInt(betInput.value) || 10;
            const chance = getChance(bet);
            chanceDisplay.innerHTML = `Шанс выигрыша: <span>${(chance * 100).toFixed(1)}%</span>`;
        }

        function renderUpgrades() {
            let html = '';
            state.upgrades.forEach(upg => {
                const cost = getUpgradeCost(upg);
                const canBuy = state.coins >= cost && upg.level < upg.maxLevel;
                const isMaxed = upg.level >= upg.maxLevel;
                
                html += `
                    <div class="upgrade-card">
                        <div class="upgrade-name">${upg.name}</div>
                        <div class="upgrade-desc">${upg.desc}</div>
                        <div class="upgrade-stats">
                            <span>ур. ${upg.level}/${upg.maxLevel}</span>
                            <span>💰 ${formatNum(cost)}</span>
                        </div>
                        <button class="upgrade-btn ${canBuy ? 'buyable' : ''}" 
                                ${!canBuy ? 'disabled' : ''}
                                onclick="window.buyUpgrade('${upg.id}')">
                            ${isMaxed ? '✅ MAX' : (canBuy ? 'Купить' : 'не хватает')}
                        </button>
                    </div>
                `;
            });
            upgradeGrid.innerHTML = html;
        }

        window.buyUpgrade = buyUpgrade;

        // ====== СБРОС ======
        function resetGame() {
            if (!confirm('Сбросить весь прогресс?')) return;
            state.coins = 50;
            state.winCount = 0;
            state.upgrades.forEach(u => u.level = 0);
            currentAngle = 0;
            drawWheel(0);
            updateUI();
            renderUpgrades();
            resultPopup.textContent = '🔄 Прогресс сброшен';
            resultPopup.style.color = '#888';
        }

        // ====== СОХРАНЕНИЕ ======
        function saveGame() {
            try {
                const data = {
                    coins: state.coins,
                    winCount: state.winCount,
                    upgrades: state.upgrades.map(u => ({ id: u.id, level: u.level }))
                };
                localStorage.setItem('casino_upgrader_save', JSON.stringify(data));
            } catch(e) {}
        }

        function loadGame() {
            try {
                const raw = localStorage.getItem('casino_upgrader_save');
                if (!raw) return;
                const data = JSON.parse(raw);
                state.coins = data.coins || 50;
                state.winCount = data.winCount || 0;
                if (data.upgrades) {
                    data.upgrades.forEach(saved => {
                        const found = state.upgrades.find(u => u.id === saved.id);
                        if (found) found.level = saved.level || 0;
                    });
                }
            } catch(e) {}
        }

        // ====== ИНИЦИАЛИЗАЦИЯ ======
        loadGame();
        drawWheel(0);
        updateUI();
        renderUpgrades();
        updateChanceDisplay();

        // События
        spinBtn.addEventListener('click', spinWheel);
        canvas.addEventListener('click', spinWheel);
        resetBtn.addEventListener('click', resetGame);

        // Пресеты ставок
        document.querySelectorAll('.bet-preset-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.bet-preset-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                betInput.value = this.dataset.amount;
                updateChanceDisplay();
                updateUI();
            });
        });

        betInput.addEventListener('input', function() {
            document.querySelectorAll('.bet-preset-btn').forEach(b => b.classList.remove('active'));
            const val = parseInt(this.value) || 1;
            updateChanceDisplay();
            updateUI();
        });

        // Автосохранение
        setInterval(saveGame, 5000);
        window.addEventListener('beforeunload', saveGame);

        console.log('🎰 Казино-Апгрейдер запущено!');
    })();
</script>
</body>
</html>
